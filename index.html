

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solstice Events - Check-in Kiosk</title>
    <style>
       body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    height: 100vh; background-color: #f3f4f6; margin: 0; 
}
.kiosk-card { 
    background: #ffffff; padding: 3rem 2.5rem; border-radius: 16px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.04); text-align: center; 
    width: 420px; box-sizing: border-box; 
}
.brand-title { 
    font-size: 24px; font-weight: 800; letter-spacing: 1.5px; 
    text-transform: uppercase; color: #111827; margin-top: 0; margin-bottom: 0.25rem; 
}
.subtitle { 
    color: #6b7280; font-size: 14px; margin-bottom: 2rem; line-height: 1.5; 
}
button { 
    background-color: #111827; color: #ffffff; border: none; padding: 14px 24px; 
    font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; 
    width: 100%; margin-bottom: 0.75rem; transition: background-color 0.2s ease; 
}
button:hover { background-color: #374151; }
button:disabled { background-color: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
#status-display { 
    font-size: 14px; font-weight: 600; margin-top: 1.5rem; padding: 12px; 
    border-radius: 8px; min-height: 20px; transition: all 0.3s ease;
}
.pending { background-color: #fef3c7; color: #92400e; }
.success { background-color: #d1fae5; color: #065f46; }
.error { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

  <div class="kiosk-card">
        <h2 class="brand-title">Solstice</h2>
        <p class="subtitle">Event Check-in Portal</p>
       
        <!-- Three buttons to satisfy the client requirement -->
        <button id="btn-ATT-101" onclick="simulateScan('ATT-101', 'btn-ATT-101')">Scan Attendee 1 (Fresh)</button>
        <button id="btn-ATT-102" onclick="simulateScan('ATT-102', 'btn-ATT-102')">Scan Attendee 2 (Fresh)</button>
        <button id="btn-dup" onclick="simulateScan('ATT-101', 'btn-dup')">Scan Attendee 1 (Duplicate Test)</button>
        
        <div id="status-display">Waiting for attendee scan...</div>
    </div>

    <script>
        // Local state to simulate database duplicate-scan protection
        const checkedInAttendees = new Set();

        async function simulateScan(attendeeId, buttonId) {
            const btn = document.getElementById(buttonId);
            const statusDisplay = document.getElementById('status-display');
            
            // Duplicate scan protection check
            if (checkedInAttendees.has(attendeeId)) {
                statusDisplay.className = 'error';
                statusDisplay.innerText = `Duplicate Blocked: Attendee ${attendeeId} is already checked in.`;
                return;
            }

            // 1. Lock the UI (Pending State)
            btn.disabled = true;
            statusDisplay.className = 'pending';
            statusDisplay.innerText = `Pending: Waiting for printer callback for ${attendeeId}...`;

            const webhookUrl = "https://solstice-webhook-ewk-g8a6d0f9fxfjfxcr.southafricanorth-01.azurewebsites.net/api/PrintJobCallback";
            
            const vendorPayload = {
                attendeeId: attendeeId,
                status: "COMPLETED"
            };

            try {
                // 2. Simulate the async callback
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    body: JSON.stringify(vendorPayload)
                });

                const responseText = await response.text();

                // 3. Update the UI 
                if (response.ok) {
                    checkedInAttendees.add(attendeeId); // Mark as checked in
                    statusDisplay.className = 'success';
                    statusDisplay.innerText = `Checked In! \n${responseText}`;
                    playDing();
                } else {
                    statusDisplay.className = 'error';
                    statusDisplay.innerText = "Error: " + responseText;
                }
            } catch (error) {
                statusDisplay.className = 'error';
                statusDisplay.innerText = "Network Error. Check console.";
                console.error("Fetch failed:", error);
            } finally {
                btn.disabled = false;
            }
        }
        function playDing() {
    const context = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = context.createOscillator();
    const gainNode = context.createGain();
    
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(880, context.currentTime); // High pitch note
    gainNode.gain.setValueAtTime(0.1, context.currentTime); // Low volume
    
    oscillator.connect(gainNode);
    gainNode.connect(context.destination);
    
    oscillator.start();
    oscillator.stop(context.currentTime + 0.15); // Plays for a fraction of a second
}
    </script>
</body>
</html>
